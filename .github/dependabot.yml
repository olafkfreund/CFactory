# Base-image updates for both Dockerfiles. Before this file, nothing in the repo
# updated a base image (Factory#436).
#
# What this replaces. renovate.json was added on 2026-07-19 by Factory#300
# ("close Renovate coverage gaps") and closed as done. It never ran: the Renovate
# GitHub App is not installed on this account, so across all five Factory repos
# there are zero Renovate PRs and no Dependency Dashboard issue has ever been
# opened, in spite of ":dependencyDashboard" being set in four of them. The gap
# the issue set out to close stayed open, invisibly, because the config read as
# the fix.
#
# The sibling repos learned the cost the expensive way: AIFactory, PFactory and
# TFactory all pinned the same Chainguard digest, upstream garbage-collected it,
# and their docker acceptance gate could not start a build for about nine weeks
# (AIFactory#1091). This repo pins no digests -- python:3.13-slim,
# node:22-alpine, nginx-unprivileged:1.27-alpine are all floating tags -- so it
# cannot fail in that exact way. It can still drift onto an unpatched base
# indefinitely, and it ships to the cluster with neither a Trivy image scan nor
# a cosign signature (Factory#310 gap #8), which makes a current base the only
# supply-chain control this image actually has.
#
# Two entries because the frontend image is built from its own context;
# Dependabot scopes a docker entry to one directory.
#
# Weekly, not daily: unlike the digest-pinned siblings there is no rot window to
# close here, so the cadence is set for review load rather than for outage risk.
#
# github-actions IS now covered (see the third entry). It was listed here as an
# uncovered gap until the actions SHA pins landed: a SHA pin freezes the action
# at a commit, which is the point, but an unwatched frozen pin rots into an
# unpatched action just as surely as a floating tag drifts. Pinning without an
# updater trades one supply-chain failure mode for another.
#
# Still not covered, stated rather than implied: `COPY --from=<image>` pins --
# Dependabot's Dockerfile parser only reads FROM,
# verified 2026-07-30 with dependabot-cli v1.91.0. Neither was covered before.
# If the Renovate App is ever installed, delete this file rather than let two
# bots rewrite the same FROM lines.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    # Factory#491: without this, Dependabot raises against whatever the repo
    # default happens to be. Every bump this repo has ever received (#198, #243,
    # #254, #255, #256) landed on `main` for that reason, putting base-image
    # changes on the deployed branch without passing through `dev` — and leaving
    # `main` 7 commits ahead of `dev`. Pin it rather than inherit it.
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
      - base-image
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # Keeps the SHA pins in .github/workflows/** current. GROUPED deliberately:
  # this repo pins nine action refs across five distinct actions, and an
  # ungrouped weekly run opens a PR per action. A five-PR-a-week bot is one that
  # gets muted, and a muted updater is the same as no updater -- which is the
  # exact failure this file's header documents for Renovate. One grouped PR is
  # reviewable, so it gets reviewed.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    # cosign-installer majors are a CLUSTER decision, not a dependency bump.
    #
    # v3.7.0 -> v4.1.2 takes cosign v2 -> v3, which moves signatures from the
    # legacy `sha256-<digest>.sig` tag to an OCI 1.1 referrer. Kyverno v1.18.2
    # reads the legacy tag only -- its buildCosignOptions never sets
    # ExperimentalOCI11 -- so every image built after that bump is rejected at
    # admission with "no signatures found" while CI stays green. It cost
    # AIFactory 3 days of stale deploys (Factory#799, Factory#804).
    #
    # `type: SigstoreBundle` does not rescue it either; that was tested against
    # the live cluster and still failed, because cosign v3 writes the OLD
    # payload at the NEW location and that matches neither Kyverno verifier.
    #
    # Unpin only when Kyverno can verify what the new cosign writes, proven
    # against the cluster. assert-signature-location.sh fails the build if this
    # is ever moved without that.
    ignore:
      - dependency-name: "sigstore/cosign-installer"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/apps/frontend-web"
    # Factory#491: without this, Dependabot raises against whatever the repo
    # default happens to be. Every bump this repo has ever received (#198, #243,
    # #254, #255, #256) landed on `main` for that reason, putting base-image
    # changes on the deployed branch without passing through `dev` — and leaving
    # `main` 7 commits ahead of `dev`. Pin it rather than inherit it.
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
      - base-image
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
