name: Code quality (ratchet)

# Factory coding-standards adoption for the CFactory Python backend.
#
# This is a RATCHET gate (coding-standards.md section 4.6): ruff (shared select
# set) + mypy --strict run ONLY on the Python files a PR changes, and a changed
# file may not gain violations vs the PR base (per-file base-vs-HEAD counts,
# scripts/ratchet_lint.py). Untouched legacy hotspots are allowed until touched,
# so the gate is green at adoption and tightens monotonically. A whole-repo
# strict gate is intentionally NOT blocking (127 legacy ruff violations and a
# ~90-error mypy --strict backlog would make it instantly red).
#
# Also runs `ruff format --check` over PACKAGE_DIR (formatting is auto-applied,
# never reviewed - section 3.6) and a drift gate confirming the vendored configs
# still match the pinned hub baseline.
#
# SCOPE, stated honestly (#267). Both Python jobs cover PACKAGE_DIR only. They do
# NOT cover apps/backend/run.py, apps/backend/migrations/**, tests/ or scripts/.
# This job used to be named "whole repo", which it never was. Widening it is a
# separate, costed decision, not a rename:
#
#   - apps/backend/runners/github/** (7 files ruff would reformat) is VENDORED
#     from the Factory hub and byte-identical drift-gated by
#     factory-github-drift.yml. Reformatting it locally would BREAK that gate, so
#     a literal "whole repo" format check is unreachable by construction and the
#     name could never have been made true as written.
#   - Of the rest, measured at ruff 0.15.17 on this tree: 7 first-party files
#     under apps/backend (run.py + 6 alembic revisions) and 27 under tests/ would
#     be reformatted - 41 files repo-wide, 34 of them legitimately widenable.
#
# So widening means a 34-file blame-churning reformat commit plus a permanent
# explicit exclude for the vendored tree. That is a deliberate choice to make on
# its own, and burying it in a gate-honesty fix would hide it. Until then the
# name states the scope the gate actually has. Same call, same reasoning, as
# PFactory#417 / PFactory PR#428.
#
# The Python backend gate (ratchet + format + drift) plus the React/Vite
# frontend gate (#112): ESLint 9 flat config (typescript-eslint strictTypeChecked
# + react-hooks), prettier --check, and the vitest boundary-schema suite. The
# frontend gate is tuned green at adoption via a warning baseline + scoped
# prettier (see eslint.config.js / package.json TODOs) and tightens over time.
# The existing test.yml separately typechecks + builds the frontend.

on:
  pull_request: {}
  push:
    branches: [dev, main]

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUFF_VERSION: "0.15.17"
  MYPY_VERSION: "1.20.1"
  PACKAGE_DIR: "apps/backend/cfactory"

jobs:
  ratchet:
    name: ruff + mypy ratchet (diff-scoped, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the PR base for the diff-scoped ratchet.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint toolchain + backend deps (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}"
          # Backend deps so mypy can resolve imports on changed files.
          pip install -r apps/backend/requirements.txt -r tests/requirements-test.txt

      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Ratchet (ruff on changed files; blocks net-new violations)
        run: python scripts/ratchet_lint.py --base "${{ steps.base.outputs.ref }}" --package "${PACKAGE_DIR}"

      - name: Ratchet (mypy --strict on changed files; blocks net-new type errors)
        # Per-file base-vs-HEAD error counts (issues #112, #116, hub Factory#260):
        # a touched legacy file keeps its existing mypy debt, but a PR may not add
        # NET-NEW strict-mode type errors to any file it changes.
        run: python scripts/ratchet_lint.py --tool mypy --base "${{ steps.base.outputs.ref }}" --package "${PACKAGE_DIR}"

  format-check:
    name: ruff format --check (apps/backend/cfactory, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff (pinned)
        run: pip install "ruff==${RUFF_VERSION}"
      - name: Check formatting
        run: ruff format --check --config ruff.toml "${PACKAGE_DIR}"

  drift:
    name: hub drift gates (shared-baseline configs + factory-contracts)
    runs-on: ubuntu-latest
    env:
      # NAMED, not inlined into the `ref:` below (Factory#547). The standards
      # half of this job reads its pin from standards/.hub-sha, which any tool
      # can `cat`. This one gates a single FILE, so it has no directory for a
      # pin file to sit beside and pins in the workflow - which Factory#514's
      # rule 5.2 permits ONLY while the hub can read the pin without opening
      # this workflow. A bare `ref: <sha>` is indistinguishable from any other
      # checkout ref to anything scanning from outside; a named variable is not.
      # scripts/check_pin_freshness.py in the hub reads exactly this name.
      CONTRACTS_PIN_SHA: "48f59a2c0a875f1637f4a442c1da4a9cd5fd1db9"
    # Two drift checks against the pinned hub, each at its own SHA:
    #   1. Vendored standards/ (ruff.toml, mypy.ini, .editorconfig and
    #      coding-standards.md) vs the baseline. The standards SHA is read from
    #      standards/.hub-sha rather than hardcoded here (Factory#513/#514): a
    #      SHA that lives only inside this workflow is not a pin, because nothing
    #      outside the workflow can find it. coding-standards.md was not vendored
    #      at all before #513, so a hub rule could say one thing while this
    #      service did another and no gate noticed (Factory#434).
    #   2. The byte-identical factory-contracts single source of truth (Factory#160)
    #      at apps/backend/cfactory/_contracts/factory_contracts/__init__.py.
    # To update either: re-vendor from the hub and bump the corresponding SHA
    # below (contracts also bumps _contracts/__init__.py + the drift test).
    steps:
      - uses: actions/checkout@v4
        with:
          path: cfactory
      # Neither hub checkout carries continue-on-error: an unreachable hub is a
      # gate that cannot run, and per standards rule 4.7 that must fail rather
      # than pass. Both steps used to be `continue-on-error: true` with each
      # diff guarded on `steps.hub_*.outcome == 'success'`, so a private repo,
      # an expired token, a renamed hub or a garbage-collected pin would skip
      # the comparison and report SUCCESS from a blocking gate. If Factory
      # becomes private, add a read token here - do not restore the soft-skip.
      # Factory#434; same removal AIFactory#1092 / #1095 made in that repo.
      - name: Read the pinned hub SHA
        id: pin
        run: |
          set -euo pipefail
          sha="$(cat cfactory/standards/.hub-sha)"
          # An empty or missing pin must fail here rather than resolve to the
          # default branch, which would compare against a MOVING target and call
          # it a match (standards rule 4.7).
          [ -n "$sha" ] || { echo "standards/.hub-sha is empty" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out hub standards at the pinned SHA
        uses: actions/checkout@v4
        with:
          repository: olafkfreund/Factory
          ref: ${{ steps.pin.outputs.sha }}
          path: factory-hub-standards
      - name: Check out hub at the pinned contracts SHA
        uses: actions/checkout@v4
        with:
          repository: olafkfreund/Factory
          ref: ${{ env.CONTRACTS_PIN_SHA }}
          path: factory-hub-contracts
      - name: Diff vendored configs against the pinned hub baseline
        run: |
          set -euo pipefail
          # Vendored copies carry a header above the body; compare the rule body
          # only by stripping leading comment lines from both sides.
          strip() { grep -vE '^[[:space:]]*([#;]|$)' "$1"; }
          for f in ruff.toml mypy.ini .editorconfig; do
            if ! diff <(strip "cfactory/standards/$f") <(strip "factory-hub-standards/standards/$f"); then
              echo "DRIFT: cfactory/standards/$f diverged from the pinned hub baseline (standards/$f)."
              echo "Re-vendor from the hub and bump standards/.hub-sha, or justify a tighten-only override in the root ruff.toml."
              exit 1
            fi
          done
          # coding-standards.md is compared BYTE-EXACT and carries no header:
          # strip() drops lines starting with '#', which in Markdown is every
          # heading, so a stripped compare would be blind to every section title.
          # Hub standards rule 5.1.
          if ! diff "cfactory/standards/coding-standards.md" "factory-hub-standards/standards/coding-standards.md"; then
            echo "DRIFT: cfactory/standards/coding-standards.md diverged from the pinned hub baseline."
            echo "The standard is vendored, not editable here. Change it in the hub, then re-vendor and bump standards/.hub-sha."
            exit 1
          fi
          echo "No drift: vendored standards match the pinned hub baseline."
      - name: Diff vendored module against the pinned hub source
        run: |
          set -euo pipefail
          vendored="cfactory/apps/backend/cfactory/_contracts/factory_contracts/__init__.py"
          hub="factory-hub-contracts/shared/factory-contracts/python/factory_contracts/__init__.py"
          if ! diff -u "$vendored" "$hub"; then
            echo "DRIFT: vendored factory_contracts diverged from the pinned hub source."
            echo "Re-vendor from the hub and bump the pinned SHA (here + _contracts/__init__.py + the drift test)."
            exit 1
          fi
          echo "No drift: vendored factory-contracts matches the pinned hub source."

  frontend-quality:
    name: frontend lint + format + unit tests (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/frontend-web/package-lock.json
      - name: Install frontend deps (incl. dev)
        # --include=dev is explicit so the gate never silently skips the lint /
        # test toolchain if the runner inherits NODE_ENV=production.
        run: npm ci --include=dev
      - name: ESLint (strictTypeChecked + react-hooks; warning baseline)
        # The legacy tree carries a grandfathered warning backlog (--max-warnings
        # in package.json); net-new warnings and ALL errors fail the build.
        run: npm run lint
      - name: Prettier --check (PR-owned files)
        run: npm run format:check
      - name: Vitest (HTTP/WS boundary schema suite)
        run: npm test
