name: CodeQL

on:
  push:
    branches: [dev, main]
  pull_request: {}
  schedule:
    - cron: "37 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality, not CodeQL's default suite (Factory#711). The
          # fleet survey found CFactory reporting 3 open alerts against
          # AIFactory's ~1470, and the gap was mostly which questions were being
          # asked: the rules behind most of that volume (py/log-injection,
          # py/stack-trace-exposure, py/empty-except, js/* quality rules) live
          # in this suite only. Passed as an input rather than a config file
          # because this repo has no custom query pack; if one is ever added
          # this MUST move into the config, since a config-file replaces this
          # input and the suite would be silently dropped.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
