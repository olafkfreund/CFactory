name: deploy drift watchdog

# Fails loudly when main is built-but-undeployed (#219).
#
# THE BODY MOVED TO THE HUB (Factory#461). This watchdog used to exist here and
# nowhere else, which is backwards relative to risk: CFactory bakes no prompts
# and no skills catalogue into its image and AIFactory, PFactory and TFactory
# all do. Rather than paste three more copies of a pathspec that Factory#454
# already proved easy to get silently wrong, the comparator and the job moved to
# olafkfreund/Factory and every repo calls it. Behaviour here is unchanged,
# including the fail-when-blind guard on a missing GITOPS_PAT and the corrected
# ':(exclude,glob)*.md' pathspec from #250.
#
#   olafkfreund/Factory .github/workflows/deploy-drift.yml
#   olafkfreund/Factory scripts/check_deploy_drift.py
#
# WHY A SEPARATE WORKFLOW AT ALL. deploy.yml sets `cancel-in-progress: true`,
# which is correct -- an older commit must not race a newer one to the cluster.
# The hazard is that cancelling run A is only safe if run B actually deploys
# something newer. On 2026-07-26 neither did: the cancelled run's `test` job took
# `build-push-bump` down with it (needs:), so no image was built and no gitops
# bump happened. Main sat undeployed while every PR check was green and the run
# showed `cancelled` -- an outcome nothing alerts on. A post-deploy step cannot
# catch that, because anything that checks a run from inside that run is
# cancelled with it. Same instinct as the CronJob health watchdog in
# Factory#381: no news must not read as success.

on:
  schedule:
    # Every 30 minutes. The comparator's grace period (45m) decides what counts
    # as late, so this only controls how quickly a real stall is noticed.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Explicitly NOT cancel-in-progress. Cancelling the thing that detects
  # cancellation damage would be an unusually direct way to reintroduce #219.
  group: deploy-drift
  cancel-in-progress: false

jobs:
  drift:
    uses: olafkfreund/Factory/.github/workflows/deploy-drift.yml@main
    with:
      gitops_path: apps/cfactory/manifests
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
