name: Deploy (CD → ArgoCD)

# Continuous deployment for CFactory's two images (backend + cockpit frontend).
# On push to main: build+push immutable sha-tagged images to GHCR, then bump the
# tags in factory-gitops so ArgoCD redeploys on the p510 k3d cluster.
#
# One-time setup: add repo secret GITOPS_PAT (fine-grained PAT, Contents:write on
# olafkfreund/factory-gitops):  gh secret set GITOPS_PAT --repo olafkfreund/CFactory

on:
  push:
    branches: [main]
    # '*.md' is root-level markdown only (README, CHANGELOG) -- deliberately
    # NOT '**/*.md', which would also ignore any markdown baked into the
    # runtime image. CFactory ships no prompts today, but the sibling services
    # do, and the rule is the same in all four repos so the next baked-in
    # markdown file cannot land undeployed. See Factory#454.
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write        # cosign keyless via GitHub OIDC (CFactory#191, Factory#430)

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cfactory
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cfactory-frontend
  GITOPS_REPO: olafkfreund/factory-gitops
  GITOPS_PATH: apps/cfactory/manifests

jobs:
  # Gate the deploy on a green test run (#81): re-run the CI suite (backend
  # pytest + frontend typecheck/build) via the reusable test workflow, and only
  # build+push+bump if it passes.
  test:
    uses: ./.github/workflows/test.yml

  build-push-bump:
    needs: test
    runs-on: ubuntu-latest
    env:
      # secrets context is not allowed in step-level `if:`; expose it here so
      # steps can gate on env.GITOPS_PAT instead.
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # The cfactory / cfactory-frontend GHCR packages are user-owned and NOT
      # linked to this repo, so the repo-scoped GITHUB_TOKEN can't push to them
      # (HEAD blob → 403 Forbidden) despite `packages: write` above. Prefer a
      # PAT with `write:packages` (secret GHCR_PAT) and fall back to the repo
      # token so this stays non-breaking once the packages ARE linked.
      # One-time setup (do ONE of):
      #   - GHCR → cfactory & cfactory-frontend → Manage Actions access → add
      #     this repo with Write (then GITHUB_TOKEN works, no secret needed), OR
      #   - gh secret set GHCR_PAT --repo olafkfreund/CFactory   (classic PAT,
      #     scope write:packages)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build + push backend
        id: build_backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push frontend (cockpit)
        id: build_frontend
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend-web
          file: apps/frontend-web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------------
      # CFactory#191 / Factory#430 — cosign keyless signing.
      #
      # CFactory was the one fleet service with no signing at all, in either
      # release or CD, and is the stated blocker on moving the cluster's
      # verify-factory-image-signatures policy from Audit to Enforce: an
      # Enforce policy that covered cfactory would have denied every cockpit
      # Pod. Signing here is what lets that rule be added.
      #
      # Sign by DIGEST, not tag: cosign signatures are digest-keyed, so one
      # signature per image covers both :sha-<short> and :latest.
      # ----------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign both images (cosign keyless via Sigstore + GitHub OIDC)
        run: |
          cosign sign --yes "${BACKEND_IMAGE}@${{ steps.build_backend.outputs.digest }}"
          cosign sign --yes "${FRONTEND_IMAGE}@${{ steps.build_frontend.outputs.digest }}"

      # Not decoration: without it a broken signing step fails open and we are
      # back to an unverifiable image that looks shipped. This is the same
      # assertion Kyverno makes at admission, run at build time.
      - name: Verify signatures (self-test)
        run: |
          for REF in \
            "${BACKEND_IMAGE}@${{ steps.build_backend.outputs.digest }}" \
            "${FRONTEND_IMAGE}@${{ steps.build_frontend.outputs.digest }}"; do
            cosign verify \
              --certificate-identity-regexp "^https://github\.com/${{ github.repository_owner }}/CFactory/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$REF"
          done

      - name: Bump factory-gitops (if GITOPS_PAT set)
        if: ${{ env.GITOPS_PAT != '' }}
        run: |
          set -e
          git clone --depth 1 "https://x:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git" gitops
          cd "gitops/${GITOPS_PATH}"
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          ./kustomize edit set image ${BACKEND_IMAGE}=${BACKEND_IMAGE}:${{ steps.tags.outputs.sha }}
          ./kustomize edit set image ${FRONTEND_IMAGE}=${FRONTEND_IMAGE}:${{ steps.tags.outputs.sha }}
          rm -f kustomize
          cd "$GITHUB_WORKSPACE/gitops"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cd(cfactory): ${{ steps.tags.outputs.sha }} [skip ci]" || { echo "no change"; exit 0; }
          git push

      - name: Note if not wired
        if: ${{ env.GITOPS_PAT == '' }}
        run: echo "::notice::Images pushed. Set GITOPS_PAT to auto-bump factory-gitops; until then bump apps/cfactory/manifests/kustomization.yaml manually."

  # Post-deploy PARR seam smoke check (Factory#44). Steps-based on purpose: a
  # cross-repo reusable-workflow `uses:` call fails the deploy at startup, so we
  # check out the Factory harness and run it directly. Soft gate — continue-on-error
  # plus `|| true` mean a probe failure can never break or roll back the deploy;
  # self-skips when FACTORY_TOKEN is unset. TODO: tighten to a required gate once stable.
  seam-check:
    needs: build-push-bump
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Factory seam harness
        uses: actions/checkout@v4
        with:
          repository: olafkfreund/Factory
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PARR seam smoke regression
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          PFACTORY_API: ${{ vars.PFACTORY_API }}
          AIFACTORY_API: ${{ vars.AIFACTORY_API }}
          TFACTORY_API: ${{ vars.TFACTORY_API }}
          CFACTORY_API: ${{ vars.CFACTORY_API }}
          # CFactory is behind oauth2-proxy, which rejects an opaque token
          # with a 302 to Keycloak. These let the probe mint a short-lived
          # service-account JWT instead (Factory#420/#423). Absent them the
          # cockpit seam reports SKIP, not a false pass.
          PARR_OIDC_TOKEN_URL: ${{ vars.PARR_OIDC_TOKEN_URL }}
          CFACTORY_OIDC_CLIENT_ID: ${{ vars.CFACTORY_OIDC_CLIENT_ID }}
          CFACTORY_OIDC_CLIENT_SECRET: ${{ secrets.CFACTORY_OIDC_CLIENT_SECRET }}
        run: |
          if [ -z "${FACTORY_TOKEN}" ]; then
            echo "FACTORY_TOKEN not set — skipping seam smoke gate."
            exit 0
          fi
          # No `|| true`. The job is already continue-on-error, so a failing
          # seam cannot break or roll back the deploy - but discarding the
          # exit code on top of that hid a hard crash on EVERY deploy
          # (Factory#416: the probe died on `ValueError: unknown url type`
          # before its first request and the job still reported green).
          # Keeping the real exit code visible is also what makes the
          # standing TODO below achievable: nobody can decide to promote
          # this to a required gate while it is incapable of failing.
          python3 scripts/parr_regression.py --smoke
