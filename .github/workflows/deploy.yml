name: Deploy (CD → ArgoCD)

# Continuous deployment for CFactory's two images (backend + cockpit frontend).
# On push to main: build+push immutable sha-tagged images to GHCR, then bump the
# tags in factory-gitops so ArgoCD redeploys on the p510 k3d cluster.
#
# One-time setup: add repo secret GITOPS_PAT (fine-grained PAT, Contents:write on
# olafkfreund/factory-gitops):  gh secret set GITOPS_PAT --repo olafkfreund/CFactory

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cfactory
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cfactory-frontend
  GITOPS_REPO: olafkfreund/factory-gitops
  GITOPS_PATH: apps/cfactory/manifests

jobs:
  build-push-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push frontend (cockpit)
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend-web
          file: apps/frontend-web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump factory-gitops (if GITOPS_PAT set)
        if: ${{ secrets.GITOPS_PAT != '' }}
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          set -e
          git clone --depth 1 "https://x:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git" gitops
          cd "gitops/${GITOPS_PATH}"
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          ./kustomize edit set image ${BACKEND_IMAGE}=${BACKEND_IMAGE}:${{ steps.tags.outputs.sha }}
          ./kustomize edit set image ${FRONTEND_IMAGE}=${FRONTEND_IMAGE}:${{ steps.tags.outputs.sha }}
          rm -f kustomize
          cd "$GITHUB_WORKSPACE/gitops"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cd(cfactory): ${{ steps.tags.outputs.sha }} [skip ci]" || { echo "no change"; exit 0; }
          git push

      - name: Note if not wired
        if: ${{ secrets.GITOPS_PAT == '' }}
        run: echo "::notice::Images pushed. Set GITOPS_PAT to auto-bump factory-gitops; until then bump apps/cfactory/manifests/kustomization.yaml manually."
