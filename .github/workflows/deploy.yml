name: Deploy (CD → ArgoCD)

# Continuous deployment for CFactory's two images (backend + cockpit frontend).
# On push to main: build+push immutable sha-tagged images to GHCR, then bump the
# tags in factory-gitops so ArgoCD redeploys on the p510 k3d cluster.
#
# One-time setup: add repo secret GITOPS_PAT (fine-grained PAT, Contents:write on
# olafkfreund/factory-gitops):  gh secret set GITOPS_PAT --repo olafkfreund/CFactory

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write        # cosign keyless via GitHub OIDC
  attestations: write    # cosign attest (SBOM)

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cfactory
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cfactory-frontend
  GITOPS_REPO: olafkfreund/factory-gitops
  GITOPS_PATH: apps/cfactory/manifests

jobs:
  # Gate the deploy on a green test run (#81): re-run the CI suite (backend
  # pytest + frontend typecheck/build) via the reusable test workflow, and only
  # build+push+bump if it passes.
  test:
    uses: ./.github/workflows/test.yml

  build-push-bump:
    needs: test
    runs-on: ubuntu-latest
    env:
      # secrets context is not allowed in step-level `if:`; expose it here so
      # steps can gate on env.GITOPS_PAT instead.
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # The cfactory / cfactory-frontend GHCR packages are user-owned and NOT
      # linked to this repo, so the repo-scoped GITHUB_TOKEN can't push to them
      # (HEAD blob → 403 Forbidden) despite `packages: write` above. Prefer a
      # PAT with `write:packages` (secret GHCR_PAT) and fall back to the repo
      # token so this stays non-breaking once the packages ARE linked.
      # One-time setup (do ONE of):
      #   - GHCR → cfactory & cfactory-frontend → Manage Actions access → add
      #     this repo with Write (then GITHUB_TOKEN works, no secret needed), OR
      #   - gh secret set GHCR_PAT --repo olafkfreund/CFactory   (classic PAT,
      #     scope write:packages)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build + push backend
        id: build_backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build + push frontend (cockpit)
        id: build_frontend
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend-web
          file: apps/frontend-web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # ----------------------------------------------------------------------
      # Supply-chain parity (Factory#317/#318): Trivy P0 gate → cosign keyless
      # sign → dual SBOM (SPDX + CycloneDX) attest, for BOTH images. Adapted
      # from the proven fleet pattern: AIFactory/TFactory release.yml (cosign +
      # Syft dual-SBOM) and the P0.8/P0.8b Trivy gate in AIFactory
      # tests/docker/test_p0_supply_chain.py.
      #
      # The gate runs AFTER push (scans the pushed image by digest) but BEFORE
      # the factory-gitops bump below, so a vulnerable image is never promoted
      # to the cluster even though it exists in GHCR.
      # ----------------------------------------------------------------------

      - name: Install Trivy (P0 CVE gate)
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest

      # Same policy as the fleet's P0.8 test: fail on FIXABLE HIGH/CRITICAL
      # only (`--ignore-unfixed`). Trivy auto-reads .trivyignore from the repo
      # root for audited exceptions. `--exit-code 1` turns a finding into a
      # hard gate.
      - name: Trivy scan backend image (fixable HIGH/CRITICAL)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${BACKEND_IMAGE}@${{ steps.build_backend.outputs.digest }}"

      - name: Trivy scan frontend image (fixable HIGH/CRITICAL)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${FRONTEND_IMAGE}@${{ steps.build_frontend.outputs.digest }}"

      # P0.8b blind spot: the cockpit's node_modules never reaches the runtime
      # image (only /app/dist is copied into nginx), so the image scan can't see
      # bundled JS deps. Scan the lockfile directly — this is the layer that
      # caught the Copilot-cache CVE class (Factory#971).
      - name: Trivy scan frontend lockfile (bundled JS deps)
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 apps/frontend-web/package-lock.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.17.8

      - name: Sign both images (cosign keyless via Sigstore + GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "${BACKEND_IMAGE}@${{ steps.build_backend.outputs.digest }}"
          cosign sign --yes "${FRONTEND_IMAGE}@${{ steps.build_frontend.outputs.digest }}"

      - name: Generate + attest dual SBOMs (SPDX + CycloneDX) for both images
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          BACKEND="${BACKEND_IMAGE}@${{ steps.build_backend.outputs.digest }}"
          FRONTEND="${FRONTEND_IMAGE}@${{ steps.build_frontend.outputs.digest }}"
          # Backend
          syft scan "$BACKEND" -o spdx-json=sbom-backend.spdx.json
          syft scan "$BACKEND" -o cyclonedx-json=sbom-backend.cyclonedx.json
          cosign attest --yes --type spdxjson  --predicate sbom-backend.spdx.json      "$BACKEND"
          cosign attest --yes --type cyclonedx --predicate sbom-backend.cyclonedx.json "$BACKEND"
          # Frontend (cockpit)
          syft scan "$FRONTEND" -o spdx-json=sbom-frontend.spdx.json
          syft scan "$FRONTEND" -o cyclonedx-json=sbom-frontend.cyclonedx.json
          cosign attest --yes --type spdxjson  --predicate sbom-frontend.spdx.json      "$FRONTEND"
          cosign attest --yes --type cyclonedx --predicate sbom-frontend.cyclonedx.json "$FRONTEND"

      - name: Verify signatures (deploy self-test)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for IMG in \
            "${BACKEND_IMAGE}@${{ steps.build_backend.outputs.digest }}" \
            "${FRONTEND_IMAGE}@${{ steps.build_frontend.outputs.digest }}"; do
            cosign verify \
              --certificate-identity-regexp "^https://github\.com/${{ github.repository_owner }}/CFactory/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$IMG"
          done

      - name: Upload SBOMs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cfactory-sboms-${{ steps.tags.outputs.sha }}
          path: sbom-*.json
          if-no-files-found: error

      - name: Bump factory-gitops (if GITOPS_PAT set)
        if: ${{ env.GITOPS_PAT != '' }}
        run: |
          set -e
          git clone --depth 1 "https://x:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git" gitops
          cd "gitops/${GITOPS_PATH}"
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          ./kustomize edit set image ${BACKEND_IMAGE}=${BACKEND_IMAGE}:${{ steps.tags.outputs.sha }}
          ./kustomize edit set image ${FRONTEND_IMAGE}=${FRONTEND_IMAGE}:${{ steps.tags.outputs.sha }}
          rm -f kustomize
          cd "$GITHUB_WORKSPACE/gitops"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cd(cfactory): ${{ steps.tags.outputs.sha }} [skip ci]" || { echo "no change"; exit 0; }
          git push

      - name: Note if not wired
        if: ${{ env.GITOPS_PAT == '' }}
        run: echo "::notice::Images pushed. Set GITOPS_PAT to auto-bump factory-gitops; until then bump apps/cfactory/manifests/kustomization.yaml manually."

  # Post-deploy PARR seam smoke check (Factory#44). Steps-based on purpose: a
  # cross-repo reusable-workflow `uses:` call fails the deploy at startup, so we
  # check out the Factory harness and run it directly. Soft gate — continue-on-error
  # plus `|| true` mean a probe failure can never break or roll back the deploy;
  # self-skips when FACTORY_TOKEN is unset. TODO: tighten to a required gate once stable.
  seam-check:
    needs: build-push-bump
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Factory seam harness
        uses: actions/checkout@v4
        with:
          repository: olafkfreund/Factory
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PARR seam smoke regression
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          PFACTORY_API: ${{ vars.PFACTORY_API }}
          AIFACTORY_API: ${{ vars.AIFACTORY_API }}
          TFACTORY_API: ${{ vars.TFACTORY_API }}
          CFACTORY_API: ${{ vars.CFACTORY_API }}
        run: |
          if [ -z "${FACTORY_TOKEN}" ]; then
            echo "FACTORY_TOKEN not set — skipping seam smoke gate."
            exit 0
          fi
          python3 scripts/parr_regression.py --smoke || true
