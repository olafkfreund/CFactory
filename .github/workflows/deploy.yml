name: Deploy (CD → ArgoCD)

# Continuous deployment for CFactory's two images (backend + cockpit frontend).
# On push to main: build+push immutable sha-tagged images to GHCR, then bump the
# tags in factory-gitops so ArgoCD redeploys on the p510 k3d cluster.
#
# One-time setup: add repo secret GITOPS_PAT (fine-grained PAT, Contents:write on
# olafkfreund/factory-gitops):  gh secret set GITOPS_PAT --repo olafkfreund/CFactory

on:
  push:
    branches: [main]
    # '*.md' is root-level markdown only (README, CHANGELOG) -- deliberately
    # NOT '**/*.md', which would also ignore any markdown baked into the
    # runtime image. CFactory ships no prompts today, but the sibling services
    # do, and the rule is the same in all four repos so the next baked-in
    # markdown file cannot land undeployed. See Factory#454.
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write        # cosign keyless via GitHub OIDC (CFactory#191, Factory#430)
  attestations: write    # cosign attest (SBOM predicates)

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cfactory
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cfactory-frontend
  GITOPS_REPO: olafkfreund/factory-gitops
  GITOPS_PATH: apps/cfactory/manifests
  # The exact signer identity the cluster's `verify-factory-image-signatures`
  # ClusterPolicy asserts at admission. Defined once so the two self-tests
  # below cannot drift apart from each other, or from the gate they model.
  #
  # Anchored at BOTH ends and naming the workflow and the ref. The previous
  # value was the repo prefix alone, which is scoped to owner and repo but
  # accepts any workflow in this repo on any ref -- `some-other.yml@refs/
  # heads/main` and `deploy.yml@refs/heads/attacker-branch` both passed it.
  # A self-test weaker than the gate it models is misleading: it would go
  # green on an image that admission would reject. Factory#522.
  #
  # NOTE: a `workflow_dispatch` run from a branch other than main WILL fail
  # these steps, because the certificate would then read `@refs/heads/<branch>`.
  # That is intended, not a bug -- such an image is denied at admission too, so
  # failing here is the self-test doing its job.
  SIGNER_IDENTITY: '^https://github\.com/${{ github.repository_owner }}/CFactory/\.github/workflows/deploy\.yml@refs/heads/main$'

jobs:
  # Gate the deploy on a green test run (#81): re-run the CI suite (backend
  # pytest + frontend typecheck/build) via the reusable test workflow, and only
  # build+push+bump if it passes.
  test:
    uses: ./.github/workflows/test.yml

  build-push-bump:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # secrets context is not allowed in step-level `if:`; expose it here so
      # steps can gate on env.GITOPS_PAT instead.
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      # The cfactory / cfactory-frontend GHCR packages are user-owned and NOT
      # linked to this repo, so the repo-scoped GITHUB_TOKEN can't push to them
      # (HEAD blob → 403 Forbidden) despite `packages: write` above. Prefer a
      # PAT with `write:packages` (secret GHCR_PAT) and fall back to the repo
      # token so this stays non-breaking once the packages ARE linked.
      # One-time setup (do ONE of):
      #   - GHCR → cfactory & cfactory-frontend → Manage Actions access → add
      #     this repo with Write (then GITHUB_TOKEN works, no secret needed), OR
      #   - gh secret set GHCR_PAT --repo olafkfreund/CFactory   (classic PAT,
      #     scope write:packages)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # Same reason as image-build.yml: without a daily-changing build arg the
      # `apt-get upgrade` layer is served from the gha cache forever, so the
      # DEPLOYED image keeps whatever Debian shipped when that layer was first
      # built. Fixing only the PR gate would turn the check green while
      # production still shipped the stale package.
      - name: Compute security-refresh token
        run: echo "SECURITY_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build + push backend
        id: build_backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build + push frontend (cockpit)
        id: build_frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: apps/frontend-web
          # The app's tsconfig extends the vendored fleet baseline, which lives
          # outside this context at standards/tsconfig.base.json (Factory#546).
          build-contexts: |
            standards=standards
          file: apps/frontend-web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # ----------------------------------------------------------------------
      # Supply-chain parity (Factory#317/#318): Trivy P0 gate → cosign keyless
      # sign → dual SBOM (SPDX + CycloneDX) attest, for BOTH images. Adapted
      # from the proven fleet pattern: AIFactory/TFactory release.yml (cosign +
      # Syft dual-SBOM) and the P0.8/P0.8b Trivy gate in AIFactory
      # tests/docker/test_p0_supply_chain.py.
      #
      # The gate runs AFTER push (scans the pushed image by digest) but BEFORE
      # the factory-gitops bump below, so a vulnerable image is never promoted
      # to the cluster even though it exists in GHCR.
      #
      # Signing itself landed separately in #247 while this branch was open;
      # the cosign install/sign/verify steps below are that landed block, kept
      # verbatim. This branch adds the layers around it: the Trivy gate in
      # front, and SBOM attestation behind.
      # ----------------------------------------------------------------------

      # Factory#808 - this step used to `curl` aquasecurity/trivy's
      # contrib/install.sh by commit SHA and `sh` it. The SHA was an `env:` in
      # THIS workflow file, and on a `pull_request` trigger the workflow file is
      # the PR's own copy; all forks of a repo share one object store, so a fork
      # PR could repoint that URL at a commit existing only in its own fork and
      # the runner would execute it. The SHA-pinned first-party action removes
      # the class rather than guarding it: the install script it runs comes from
      # a ref pinned inside the action, which a PR here cannot edit.
      #
      # It also replaces the hand-rolled retry loop (a download that failed after
      # the version resolved, observed once in 37 runs 2026-08-10): the action
      # fetches the script with actions/checkout, which retries on its own.
      #
      # Do NOT add `continue-on-error` - a scan that passes without scanning is
      # a control that would look identical having done nothing (rule 4.10). The
      # `--version` step below asserts the binary is runnable, not assumed.
      - name: Install Trivy (P0 CVE gate)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          # Pinned, not `latest` (Factory#664): `latest` means the scanner
          # changes without a commit, so a scan verdict is not attributable to
          # anything in git and a Trivy release can turn the fleet red at once
          # with no change from us. Bump deliberately, like image digests and
          # CLI pins.
          version: v0.73.0
          # `path` is deliberately unset. The action installs into
          # `<path>/trivy-bin`, NOT `<path>`, so passing the old
          # `${HOME}/.local/bin` would not reproduce the old layout - and it is
          # not needed anyway: the action appends its own bin dir to
          # $GITHUB_PATH, which is why the manual `echo >> "$GITHUB_PATH"` is
          # gone from this step.

      - name: Trivy binary is runnable
        run: trivy --version

      # Same policy as the fleet's P0.8 test: fail on FIXABLE HIGH/CRITICAL
      # only (`--ignore-unfixed`). Trivy auto-reads .trivyignore from the repo
      # root for audited exceptions. `--exit-code 1` turns a finding into a
      # hard gate.
      - name: Trivy scan backend image (fixable HIGH/CRITICAL)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${BACKEND_IMAGE}@${{ steps.build_backend.outputs.digest }}"

      - name: Trivy scan frontend image (fixable HIGH/CRITICAL)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${FRONTEND_IMAGE}@${{ steps.build_frontend.outputs.digest }}"

      # P0.8b blind spot: the cockpit's node_modules never reaches the runtime
      # image (only /app/dist is copied into nginx), so the image scan can't see
      # bundled JS deps. Scan the lockfile directly — this is the layer that
      # caught the Copilot-cache CVE class (Factory#971).
      #
      # `--include-dev-deps` is load-bearing (CFactory#327). Trivy suppresses
      # devDependencies by default and logs it, and without the flag this step
      # reported a confident `0` while four fixable HIGHs sat in the lockfile —
      # one of them an advisory Dependabot had open against this very file. The
      # default is reasonable in general and wrong for THIS step: it exists
      # precisely because dev deps do reach the shipped bundle. Vite bundles
      # whatever the source imports, and the dependencies/devDependencies split
      # in package.json is a packaging convention, not a statement about what
      # lands in `dist`. A gate that measures less than its name claims is worse
      # than an absent one, because the `0` is read as evidence (Factory#642).
      # tests/test_trivy_gates.py asserts the flag is still here.
      - name: Trivy scan frontend lockfile (bundled JS deps, incl. dev)
        run: |
          trivy fs --scanners vuln --include-dev-deps \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 apps/frontend-web/package-lock.json

      # ----------------------------------------------------------------------
      # CFactory#191 / Factory#430 — cosign keyless signing.
      #
      # CFactory was the one fleet service with no signing at all, in either
      # release or CD, and is the stated blocker on moving the cluster's
      # verify-factory-image-signatures policy from Audit to Enforce: an
      # Enforce policy that covered cfactory would have denied every cockpit
      # Pod. Signing here is what lets that rule be added.
      #
      # Sign by DIGEST, not tag: cosign signatures are digest-keyed, so one
      # signature per image covers both :sha-<short> and :latest.
      # ----------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1

      - name: Sign both images (cosign keyless via Sigstore + GitHub OIDC)
        run: |
          cosign sign --yes "${BACKEND_IMAGE}@${{ steps.build_backend.outputs.digest }}"
          cosign sign --yes "${FRONTEND_IMAGE}@${{ steps.build_frontend.outputs.digest }}"

      # Not decoration: without it a broken signing step fails open and we are
      # back to an unverifiable image that looks shipped. This is the same
      # assertion Kyverno makes at admission, run at build time.
      - name: Verify signatures (self-test)
        run: |
          for REF in \
            "${BACKEND_IMAGE}@${{ steps.build_backend.outputs.digest }}" \
            "${FRONTEND_IMAGE}@${{ steps.build_frontend.outputs.digest }}"; do
            cosign verify \
              --certificate-identity-regexp "${SIGNER_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$REF"
          done

      # The self-test above asks cosign about cosign. This asks the question
      # the CLUSTER asks. See the script header and Factory#804.
      - name: Assert the signatures are where Kyverno looks (Factory#804)
        run: |
          ./.github/scripts/assert-signature-location.sh "${BACKEND_IMAGE}" "${{ steps.build_backend.outputs.digest }}"
          ./.github/scripts/assert-signature-location.sh "${FRONTEND_IMAGE}" "${{ steps.build_frontend.outputs.digest }}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Generate + attest dual SBOMs (SPDX + CycloneDX) for both images
        run: |
          BACKEND="${BACKEND_IMAGE}@${{ steps.build_backend.outputs.digest }}"
          FRONTEND="${FRONTEND_IMAGE}@${{ steps.build_frontend.outputs.digest }}"
          # Backend
          syft scan "$BACKEND" -o spdx-json=sbom-backend.spdx.json
          syft scan "$BACKEND" -o cyclonedx-json=sbom-backend.cyclonedx.json
          cosign attest --yes --type spdxjson  --predicate sbom-backend.spdx.json      "$BACKEND"
          cosign attest --yes --type cyclonedx --predicate sbom-backend.cyclonedx.json "$BACKEND"
          # Frontend (cockpit)
          syft scan "$FRONTEND" -o spdx-json=sbom-frontend.spdx.json
          syft scan "$FRONTEND" -o cyclonedx-json=sbom-frontend.cyclonedx.json
          cosign attest --yes --type spdxjson  --predicate sbom-frontend.spdx.json      "$FRONTEND"
          cosign attest --yes --type cyclonedx --predicate sbom-frontend.cyclonedx.json "$FRONTEND"

      # Same reasoning as the signature self-test above, applied to the
      # attestations: `cosign attest` uploading nothing, or uploading under a
      # predicate type no verifier asks for, fails silently and leaves an
      # "SBOM-attested" claim with no SBOM behind it. Assert all four
      # predicates are actually retrievable before the image is promoted.
      - name: Verify SBOM attestations (self-test)
        run: |
          for REF in \
            "${BACKEND_IMAGE}@${{ steps.build_backend.outputs.digest }}" \
            "${FRONTEND_IMAGE}@${{ steps.build_frontend.outputs.digest }}"; do
            for TYPE in spdxjson cyclonedx; do
              cosign verify-attestation --type "$TYPE" \
                --certificate-identity-regexp "${SIGNER_IDENTITY}" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                "$REF" > /dev/null
            done
          done

      - name: Upload SBOMs as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cfactory-sboms-${{ steps.tags.outputs.sha }}
          path: sbom-*.json
          if-no-files-found: error

      - name: Bump factory-gitops (if GITOPS_PAT set)
        if: ${{ env.GITOPS_PAT != '' }}
        run: |
          set -euo pipefail
          SHA="${{ steps.tags.outputs.sha }}"

          # Factory#527: every service bumps this same repo, so two deploys in
          # flight together used to race -- clone, edit, push, and the loser got
          # `! [rejected] main -> main (fetch first)`. Its pin silently stayed on
          # the previous sha while its build, release PR and issue all reported
          # success. Retry the WHOLE cycle rather than rebasing: the clone is
          # shallow (rebase is awkward) and the edit is idempotent, so re-doing it
          # from a fresh clone is simpler -- and it preserves the rival's commit
          # instead of force-pushing over it.
          pushed=""
          for attempt in 1 2 3 4 5; do
            rm -rf gitops
            git clone --quiet --depth 1 "https://x:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git" gitops
            cd "gitops/${GITOPS_PATH}"
            curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
            ./kustomize edit set image "${BACKEND_IMAGE}=${BACKEND_IMAGE}:${SHA}"
            ./kustomize edit set image "${FRONTEND_IMAGE}=${FRONTEND_IMAGE}:${SHA}"
            rm -f kustomize
            cd "$GITHUB_WORKSPACE/gitops"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if git diff --quiet; then
              # `|| { echo "no change"; exit 0; }` used to conflate two cases.
              # Tell them apart: already pinned (fine) versus the edit matched
              # nothing (a broken bump that reported success). BOTH images are
              # checked -- one moving and the other not is the interesting failure.
              if grep -rq "newTag: ${SHA}\|${BACKEND_IMAGE}:${SHA}" "${GITOPS_PATH}/" \
                 && grep -rq "newTag: ${SHA}\|${FRONTEND_IMAGE}:${SHA}" "${GITOPS_PATH}/"; then
                echo "gitops already pinned to ${SHA}; nothing to do."
                pushed="already"
                break
              fi
              echo "::error::the image edit changed nothing AND the pins are not both ${SHA}."
              echo "::error::The kustomize pattern no longer matches this manifest."
              exit 1
            fi

            git commit --quiet -am "cd(cfactory): ${SHA} [skip ci]"
            if git push --quiet; then
              pushed="yes"
              break
            fi
            echo "push rejected (attempt ${attempt}/5) - another service bumped first; retrying"
            cd "$GITHUB_WORKSPACE"
            sleep $(( attempt * 3 ))
          done

          if [ -z "$pushed" ]; then
            echo "::error::could not push the image bump after 5 attempts (Factory#527)."
            exit 1
          fi

          # A deploy that cannot prove the pins moved must not report success
          # (Factory#433). Re-read from the remote rather than trusting the push.
          cd "$GITHUB_WORKSPACE"
          rm -rf gitops-verify
          git clone --quiet --depth 1 "https://x:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git" gitops-verify
          # `kustomize edit set image` writes `name:` and `newTag:` as SEPARATE
          # YAML fields -- never `image:tag` on one line -- so the joined form
          # NEVER matched and this failed a deploy that had worked. Both images
          # share one manifest and one sha, so a single newTag check covers both.
          if grep -rq "newTag: ${SHA}\|${BACKEND_IMAGE}:${SHA}" "gitops-verify/${GITOPS_PATH}/" \
             && grep -rq "newTag: ${SHA}\|${FRONTEND_IMAGE}:${SHA}" "gitops-verify/${GITOPS_PATH}/"; then
            echo "verified: ${GITOPS_REPO} pins both images at ${SHA}"
          else
            echo "::error::pushed, but ${GITOPS_REPO} does not pin both images at ${SHA}."
            exit 1
          fi

      - name: Note if not wired
        if: ${{ env.GITOPS_PAT == '' }}
        run: echo "::notice::Images pushed. Set GITOPS_PAT to auto-bump factory-gitops; until then bump apps/cfactory/manifests/kustomization.yaml manually."

  # Post-deploy PARR seam smoke check (Factory#44). Steps-based on purpose: a
  # cross-repo reusable-workflow `uses:` call fails the deploy at startup, so we
  # check out the Factory harness and run it directly.
  #
  # SOFT ABOUT SEAMS, HARD ABOUT ITSELF (Factory#471). `continue-on-error` used
  # to sit on the job, which meant it swallowed everything - including the guard
  # step that exits when FACTORY_TOKEN is missing. So a rotated or deleted secret
  # produced a green post-deploy check that had probed nothing at all, which is
  # indistinguishable from a healthy fleet.
  #
  # It now sits on the probe step alone. A regressed seam still shows up as a
  # failed-but-ignored step and cannot break or roll back a deploy that has
  # already happened - that intent is unchanged. A missing token is a different
  # animal: it is never transient, no re-run fixes it, and it means the check did
  # not run. That fails the job (standards/coding-standards.md rule 4.7).
  seam-check:
    needs: build-push-bump
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Factory seam harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olafkfreund/Factory
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require the fleet token (fail closed, rule 4.7)
        # Deliberately NOT continue-on-error, and deliberately its own step. This
        # is the "should have run and could not" case: deploy.yml only ever runs
        # on push to main in this repo, where secrets are always available, so an
        # empty token is misconfiguration - never the by-design fork-PR case
        # where GitHub withholds secrets and no amount of fixing would help.
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          if [ -z "${FACTORY_TOKEN}" ]; then
            echo "::error::FACTORY_TOKEN is not set; the post-deploy seam check did not run."
            echo "Set it with: gh secret set FACTORY_TOKEN --repo ${{ github.repository }}"
            echo "Failing rather than skipping (Factory#471): a green check that"
            echo "probed nothing looks exactly like a healthy fleet."
            exit 1
          fi

      - name: PARR seam smoke regression
        # Soft: a regressed seam shows as failed-but-ignored and does not break a
        # deploy that already shipped. The exit code stays real so the failure is
        # visible - Factory#416 was a probe that crashed before its first request
        # on every deploy and still reported green.
        continue-on-error: true
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          PFACTORY_API: ${{ vars.PFACTORY_API }}
          AIFACTORY_API: ${{ vars.AIFACTORY_API }}
          TFACTORY_API: ${{ vars.TFACTORY_API }}
          CFACTORY_API: ${{ vars.CFACTORY_API }}
          # CFactory is behind oauth2-proxy, which rejects an opaque token
          # with a 302 to Keycloak. These let the probe mint a short-lived
          # service-account JWT instead (Factory#420/#423). Absent them the
          # cockpit seam reports SKIP, not a false pass.
          PARR_OIDC_TOKEN_URL: ${{ vars.PARR_OIDC_TOKEN_URL }}
          CFACTORY_OIDC_CLIENT_ID: ${{ vars.CFACTORY_OIDC_CLIENT_ID }}
          CFACTORY_OIDC_CLIENT_SECRET: ${{ secrets.CFACTORY_OIDC_CLIENT_SECRET }}
        run: python3 scripts/parr_regression.py --smoke
