# image-build.yml — Factory#486.
#
# Compiles both CFactory Dockerfiles on every pull request. Until this existed,
# no PR check in this repo built either of them: test.yml runs pytest and a host
# `vite build`, and deploy.yml — which runs only on push to main — was the first
# thing to compile a Dockerfile. #255 bumped the cockpit build stage from
# node:22-alpine to node:26-alpine, four major versions, and was first compiled
# after it had already landed on the deployed branch.
#
# Shape copied from TFactory's nix-runner-image.yml and PFactory's
# runner-images.yml, which already do exactly this for their runner images.
# Differences, on purpose:
#
#   NO `paths:` filter. A required status check that does not run on a given PR
#   leaves that PR blocked forever, so this runs on every PR unconditionally.
#   (Related trap this fleet has been bitten by: in GitHub path filters `*` does
#   not cross `/`, so '*.md' and '**/*.md' select different things.)
#
#   No registry write. `push: false`, no docker/login-action, no packages: write.
#   `load: true` only so the smoke steps below can run the images.
#
# Rule 4.7 — every way this job can fail to do its work is an explicit failure:
#   * No matrix, so there is no "matrix resolved to zero targets" silent pass.
#     Both images are built by named steps that always run.
#   * No `if:` on any step, so no step can be skipped into a green.
#   * Neither build is trusted on its own. Each has a smoke step asserting the
#     image was actually produced (`docker image inspect`) and actually runs. The
#     frontend smoke asserts the Vite bundle is non-empty inside the image, which
#     is precisely what a bad Node major bump would break.
#
# CFactory#329 — this gate built both Dockerfiles and never scanned them. The
# repo's only Trivy gate was in deploy.yml, on `push: branches: [main]`, i.e.
# AFTER merge. Deploy run 31193027802 duly failed on two fixable HIGHs and left
# `main` merged-but-undeployed until someone fixed it forward (#328), with every
# PR check on the offending commit green because none of them looked. This is
# the class tests/test_deploy_trigger_covers_baked_files.py already ruled on:
# Factory#525 settled that post-merge is a strictly worse place to find it.
#
# Defence in depth, NOT a replacement. deploy.yml keeps its gate exactly as it
# is, and must: it scans the PUSHED image by digest, which is the artifact that
# actually ships, and it catches drift between merge and deploy that no PR-time
# scan can see. What this adds is the common case — a dependency or base-image
# bump that introduces a fixable HIGH — caught in the PR that proposes it, by
# the person who can most cheaply fix it. The flags are copied from deploy.yml
# character for character so the two gates cannot drift into disagreeing about
# what "clean" means; tests/test_trivy_gates.py asserts that they have not.

name: Image build (PR gate)

on:
  pull_request: {}
  # Populate the gha layer cache on the default branch so PR runs are warm.
  push:
    branches: [dev]

concurrency:
  # Includes github.workflow: a bare `<name>-${{ github.ref }}` group collides
  # with any other workflow that reuses the same key on the same ref, and the two
  # runs then cancel each other — which is exactly what test.yml was doing (#265).
  group: image-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_TAG: cfactory:pr-${{ github.sha }}
  FRONTEND_TAG: cfactory-frontend:pr-${{ github.sha }}

jobs:
  build:
    name: Build both Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Factory#495 — the toolchain CI tests on and the toolchain the image
      # builds with must be the same Node major.
      #
      # They were not. This repo tested on one major and built the shipped bundle
      # on another, and `engines` was satisfied by both so nothing complained.
      # The build below (#486) catches a Node major that cannot BUILD. It cannot
      # catch one that builds a DIFFERENT bundle from the one the tests ran
      # against — different Rollup native binary, different transpile target,
      # different `npm ci` resolution — because in that case the tests are green
      # AND the image builds.
      #
      # `.nvmrc` is the single declaration. Every `actions/setup-node` reads it
      # via `node-version-file`, so the workflow side cannot drift by
      # construction; this step is what stops the Dockerfile drifting away from
      # it, which is the direction it drifted last time (a base-image bump that
      # did not move the workflow). Runs before the build so a mismatch fails in
      # seconds rather than after a full image compile.
      #
      # Fails closed (rule 4.7): a renamed stage, a moved Dockerfile or a deleted
      # .nvmrc leaves one side empty, and an empty-vs-empty comparison would
      # otherwise pass. Both sides are asserted non-empty first.
      - name: Node major — .nvmrc must match the image's frontend build stage
        env:
          NODE_DOCKERFILE: apps/frontend-web/Dockerfile
          NODE_STAGE: build
        run: |
          set -euo pipefail
          # `|| true` on both captures so an ABSENT input reaches the explicit
          # error below: under `pipefail` a failing grep would otherwise kill the
          # step with no message at all, which is a red build nobody can read.
          declared="$(head -n1 .nvmrc 2>/dev/null | tr -dc '0-9.' | cut -d. -f1 || true)"
          built="$(grep -E "^FROM .* AS ${NODE_STAGE}\$" "${NODE_DOCKERFILE}" 2>/dev/null \
                   | grep -oE 'node:[0-9]+' | cut -d: -f2 | sort -u || true)"
          test -n "${declared}" \
            || { echo "::error::.nvmrc is missing or declares no Node major"; exit 1; }
          test -n "${built}" \
            || { echo "::error::no 'FROM ... node:<major> AS ${NODE_STAGE}' in ${NODE_DOCKERFILE}"; exit 1; }
          if [ "${declared}" != "${built}" ]; then
            echo "::error::Node major drift: .nvmrc says ${declared}, ${NODE_DOCKERFILE} stage ${NODE_STAGE} builds on ${built}"
            exit 1
          fi
          echo "Node major aligned: ${declared} (.nvmrc == ${NODE_DOCKERFILE} stage ${NODE_STAGE})"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Factory#808 - this step used to `curl` aquasecurity/trivy's
      # contrib/install.sh by commit SHA and `sh` it. The SHA was an `env:` in
      # THIS workflow file, and on a `pull_request` trigger the workflow file is
      # the PR's own copy; all forks of a repo share one object store, so a fork
      # PR could repoint that URL at a commit existing only in its own fork and
      # the runner would execute it. The SHA-pinned first-party action removes
      # the class rather than guarding it: the install script it runs comes from
      # a ref pinned inside the action, which a PR here cannot edit.
      #
      # It also replaces the hand-rolled retry loop (a download that failed after
      # the version resolved, observed once in 37 runs 2026-08-10): the action
      # fetches the script with actions/checkout, which retries on its own.
      #
      # Do NOT add `continue-on-error` - a scan that passes without scanning is
      # a control that would look identical having done nothing (rule 4.10). The
      # `--version` step below asserts the binary is runnable, not assumed.
      - name: Install Trivy (PR-time CVE gate)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          # Pinned, not `latest` (Factory#664): `latest` means the scanner
          # changes without a commit, so a scan verdict is not attributable to
          # anything in git and a Trivy release can turn the fleet red at once
          # with no change from us. Bump deliberately, like image digests and
          # CLI pins.
          version: v0.73.0
          # `path` is deliberately unset. The action installs into
          # `<path>/trivy-bin`, NOT `<path>`, so passing the old
          # `${HOME}/.local/bin` would not reproduce the old layout - and it is
          # not needed anyway: the action appends its own bin dir to
          # $GITHUB_PATH, which is why the manual `echo >> "$GITHUB_PATH"` is
          # gone from this step.

      - name: Trivy binary is runnable
        run: trivy --version

      # The lockfile scan, run here as well as in deploy.yml. It needs no image,
      # so it costs a few seconds and fails before either build. `.trivyignore`
      # at the repo root is auto-read by both, so an audited exception is
      # honoured identically in the PR gate and at deploy.
      - name: Trivy scan frontend lockfile (bundled JS deps, incl. dev)
        run: |
          trivy fs --scanners vuln --include-dev-deps \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 apps/frontend-web/package-lock.json

      # Rebuild the base-security layer at most once a day. Without this the
      # `apt-get upgrade` layer is served from the gha cache indefinitely, so a
      # Debian security fix never reaches the image and Trivy fails on a CVE the
      # Dockerfile already had remediation for (CVE-2026-14456, openssl).
      - name: Compute security-refresh token
        run: echo "SECURITY_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      # amd64 only, matching deploy.yml — the p510 k3d cluster is amd64.
      - name: Build backend Dockerfile (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.BACKEND_TAG }}
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha,scope=image-build-backend
          cache-to: type=gha,mode=max,scope=image-build-backend

      - name: Smoke — backend image exists and imports the app
        run: |
          set -euo pipefail
          docker image inspect "${BACKEND_TAG}" > /dev/null
          docker run --rm "${BACKEND_TAG}" \
            python -c 'import cfactory.app; print("cfactory backend image ok")'

      - name: Trivy scan backend image (fixable HIGH/CRITICAL)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${BACKEND_TAG}"

      - name: Build cockpit frontend Dockerfile (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: apps/frontend-web
          # The app's tsconfig extends the vendored fleet baseline, which lives
          # outside this context at standards/tsconfig.base.json (Factory#546).
          build-contexts: |
            standards=standards
          file: apps/frontend-web/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.FRONTEND_TAG }}
          cache-from: type=gha,scope=image-build-frontend
          cache-to: type=gha,mode=max,scope=image-build-frontend

      - name: Smoke — frontend image exists and carries a built bundle
        run: |
          set -euo pipefail
          docker image inspect "${FRONTEND_TAG}" > /dev/null
          docker run --rm --entrypoint sh "${FRONTEND_TAG}" -c '
            set -eu
            test -s /usr/share/nginx/html/index.html
            test -d /usr/share/nginx/html/assets
            echo "cfactory frontend image ok"
          '

      - name: Trivy scan frontend image (fixable HIGH/CRITICAL)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${FRONTEND_TAG}"
