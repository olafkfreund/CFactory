name: secret-scan

# Gitleaks secret scanning (Factory#724). Two jobs, deliberately different
# checkout depth for a reason:
#
#   pr-diff-scan     runs on `pull_request`. gitleaks-action's own scan logic
#                     (src/gitleaks.js `Scan()`) restricts a pull_request event
#                     to `--log-opts=--no-merges --first-parent {base}^..{head}`,
#                     i.e. only the commits in the PR - so a shallow checkout is
#                     enough and the job stays fast.
#
#   full-history-scan runs on `schedule` and `workflow_dispatch`. Neither event
#                     matches gitleaks-action's `push`/`pull_request` branches,
#                     so it falls through to a plain `gitleaks detect` with no
#                     log-opts restriction - a full-history scan - but that only
#                     works if the checkout actually HAS the full history, hence
#                     `fetch-depth: 0` here specifically.
#
# Versions are pinned to full commit SHAs (Factory#715 - moving tags let a
# compromised upstream tag silently repoint what CI runs).

permissions:
  contents: read

on:
  pull_request:
  schedule:
    - cron: '29 4 * * *'
  workflow_dispatch:

jobs:
  pr-diff-scan:
    name: gitleaks (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WITHOUT THIS the action uses its own bundled config and never reads
          # this repo's .gitleaks.toml, so every reviewed allowlist entry is
          # silently ignored. The full-history CLI step runs
          # `gitleaks detect --source .`, which picks the file up from the repo
          # root automatically -- so the two paths disagreed about the same
          # repo, and PRs failed on the secret scanner's OWN test fixtures
          # while the scheduled scan passed. Found on AIFactory#1335.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  full-history-scan:
    name: gitleaks (full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WITHOUT THIS the action uses its own bundled config and never reads
          # this repo's .gitleaks.toml, so every reviewed allowlist entry is
          # silently ignored. The full-history CLI step runs
          # `gitleaks detect --source .`, which picks the file up from the repo
          # root automatically -- so the two paths disagreed about the same
          # repo, and PRs failed on the secret scanner's OWN test fixtures
          # while the scheduled scan passed. Found on AIFactory#1335.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
