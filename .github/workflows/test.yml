name: Test (CI gate)

# Pre-merge gate for the CFactory cockpit. Runs the backend pytest suite and a
# TypeScript typecheck + production build of the frontend on every PR and push.
# The Deploy (CD) workflow is gated on this passing — see deploy.yml's `needs`.

on:
  pull_request: {}
  push:
    branches: [dev, main]
  workflow_call: {}

concurrency:
  # #265: this group used to be `test-${{ github.ref }}`, which does not mention
  # the workflow. A single push to `main` starts TWO instances of this file — the
  # standalone `push:` trigger above, and the `workflow_call` copy deploy.yml runs
  # as its `test` job — and both landed in the identical group, so one cancelled
  # the other on every push. Which one lost was a race: when the standalone lost,
  # nothing broke; when the called one loses, `needs: test` sees a cancelled job
  # and the deploy is silently skipped. Meanwhile `Test (CI gate)` showed
  # cancelled on every main push, which trains people to stop reading its colour.
  #
  # `github.workflow` resolves to the CALLER's workflow name inside a reusable
  # workflow, so the deploy-invoked copy gets its own group and the two stop
  # colliding. Nothing is narrowed: both instances still run.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install backend + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt -r tests/requirements-test.txt
      - name: Run backend test suite
        run: PYTHONPATH=apps/backend pytest -v

      # Frontend-client drift gate (Factory#1005). apps/frontend-web/src/api.ts
      # is hand-maintained against these routes; nothing used to notice when the
      # backend renamed a route or changed a response shape and the client did
      # not follow. This regenerates the committed contract (in-process, seeded
      # temp store, no network, no server to boot) and fails if it is stale, so
      # a route rename, a route removal, a renamed field AND a backend addition
      # all show up here with the offending lines printed.
      #
      # BLOCKING on purpose, with no continue-on-error: an advisory drift gate
      # is a dark gate. The other half of this runs as
      # apps/frontend-web/src/apiContract.test.ts in code-quality.yml's vitest
      # job, which replays the recorded bodies through the client's own schemas.
      - name: API contract is in sync with the backend (drift gate)
        run: PYTHONPATH=apps/backend python scripts/dump_api_contract.py --check

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/frontend-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/frontend-web/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (tsc + vite)
        run: npm run build
