name: Test (CI gate)

# Pre-merge gate for the CFactory cockpit. Runs the backend pytest suite and a
# TypeScript typecheck + production build of the frontend on every PR and push.
# The Deploy (CD) workflow is gated on this passing — see deploy.yml's `needs`.

on:
  pull_request: {}
  push:
    branches: [dev, main]
  workflow_call: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt -r tests/requirements-test.txt
      - name: Run backend test suite
        run: PYTHONPATH=apps/backend pytest -v

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend-web/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (tsc + vite)
        run: npm run build
