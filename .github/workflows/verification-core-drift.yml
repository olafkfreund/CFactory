name: verification-core drift gate

# Blocking drift gate for the vendored canonical layer (Factory#158,
# epic Factory#154, CFactory#233).
#
# CFactory hand-vendors one module from the Factory hub's canonical surface
# (the hub's scripts/):
#   scripts/ratchet_helpers.py   (shared lint-ratchet rules, Factory#403/#410)
#
# That copy MUST stay byte-identical to the hub canonical. This job checks out
# the hub at a PINNED SHA and runs the hub's own drift gate
# (scripts/check_verification_core_drift.py) against this checkout. A byte
# mismatch fails the build.
#
# Until now CFactory vendored the file with NO gate of any kind, so it could
# diverge silently and indefinitely — the same false-green shape as
# Factory#397 and Factory#400. An unchecked vendored copy is worse than no
# vendored copy, because it carries the appearance of a contract.
#
# To intentionally change a vendored module: land the change in the hub
# canonical first (CODEOWNERS-reviewed), re-vendor it here byte-for-byte, and
# bump HUB_PIN_SHA below. Never edit a vendored copy to satisfy a local style
# bar — the copies are governed by this byte-exact gate, not the repo style
# config.

on:
  pull_request:
    branches: [dev, main]
    # NO paths: FILTER, deliberately (Factory#525). This used to list the
    # vendored copies, which was correct while the gate only compared bytes --
    # it had nothing to say unless one of those paths changed, and Factory#400
    # is the story of that list being incomplete.
    #
    # The stray-copy guard (Factory#523) inverted the requirement. It exists to
    # catch a vendored module appearing at a path NOBODY HAS LISTED: a fresh
    # copy, or one left behind when a mapping was removed. Such a PR touches
    # none of the listed paths by definition, so the filter switched the gate
    # off in exactly the case the guard was written for, and the unmapped copy
    # landed on the default branch unseen.
    #
    # The list was also a second, hand-maintained copy of the hub's
    # SERVICE_LAYOUTS living in a workflow file -- the fork-with-a-citation
    # shape Factory#483 exists to undo. Its history here is a changelog of
    # being patched one module at a time, always after the fact.
    #
    # The gate is a few seconds of Python against a checkout. Running it on
    # every PR costs almost nothing and removes a whole class of "the check did
    # not run" -- which on a green PR page is indistinguishable from "the check
    # passed" (Factory#471).
  push:
    branches: [dev, main]

concurrency:
  group: vcore-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned Factory hub commit carrying the canonical modules. Bump deliberately
  # when re-vendoring (see header). MUST name a commit that actually contains
  # the gated file: the pin used to sit behind ratchet_helpers.py's own
  # creation fleet-wide, which would fail every service with "canonical
  # missing" (Factory#403).
  HUB_PIN_SHA: "de50e3fe06af17631cc374c4dbdbd4d34e1ac058"

jobs:
  drift:
    name: vendored copies match the hub canonical (byte-exact)
    runs-on: ubuntu-latest
    steps:
      - name: Check out this service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: service

      - name: Check out the Factory hub canonical at the pinned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olafkfreund/Factory
          ref: ${{ env.HUB_PIN_SHA }}
          path: factory-hub

      - name: Check out the hub drift CHECKER at main
        # Not at HUB_PIN_SHA: a gate fetched from its own pin cannot ship its
        # own fix. The CANONICAL above stays pinned, so comparisons remain
        # reproducible; only the gate's own logic floats (Factory#405).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olafkfreund/Factory
          ref: main
          path: factory-hub-main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the hub drift gate against this service (blocking)
        run: |
          python factory-hub-main/scripts/check_verification_core_drift.py \
            --canonical factory-hub/scripts \
            --service cfactory \
            --root service
