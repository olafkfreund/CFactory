# Backstage software-catalog descriptor for CFactory.
# Hand-maintained (supersedes the auto-generated stub from the catalog-onboard
# workflow). Mirrors the sibling PFactory catalog conventions.
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cfactory
  title: CFactory
  description: >-
    Agentic control-tower cockpit over the PARR pipeline — one pane of glass +
    LLM copilot across PFactory, AIFactory and TFactory. Observes work threaded
    by correlation key, surfaces anomalies, and proposes human-confirmed actions.
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: olafkfreund/CFactory
    backstage.io/source-location: url:https://github.com/olafkfreund/CFactory/
  tags:
    - python
    - fastapi
    - cockpit
    - observability
    - copilot
    - ai
  links:
    - url: https://cfactory.freundcloud.com/
      title: Website
      icon: web
spec:
  type: service
  lifecycle: experimental
  owner: olafkfreund
  domain: public
  providesApis:
    - cfactory-api
  dependsOn:
    - component:pfactory
    - component:aifactory
    - component:tfactory
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cfactory-portal
  title: CFactory Portal
  description: >-
    React 19 + Vite cockpit UI for CFactory — the live pipeline board, copilot
    chat panel, audit trail and token/cost views over the REST/WebSocket API.
  annotations:
    github.com/project-slug: olafkfreund/CFactory
    backstage.io/source-location: url:https://github.com/olafkfreund/CFactory/tree/main/apps/frontend-web/
  tags:
    - react
    - typescript
    - vite
    - frontend
spec:
  type: website
  lifecycle: experimental
  owner: olafkfreund
  domain: public
  consumesApis:
    - cfactory-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: cfactory-api
  title: CFactory API
  description: >-
    Curated summary of CFactory's REST + WebSocket cockpit surface. The live
    /openapi.json served by the FastAPI app is the source of truth.
  annotations:
    backstage.io/source-location: url:https://github.com/olafkfreund/CFactory/
  tags:
    - rest
    - openapi
spec:
  type: openapi
  lifecycle: experimental
  owner: olafkfreund
  definition:
    $text: ./openapi.yaml
