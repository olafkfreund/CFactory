apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cfactory.fullname" . }}-config
  labels:
    {{- include "cfactory.labels" . | nindent 4 }}
data:
  # Non-secret CFACTORY_* settings. The app reads these via the env_prefix
  # "CFACTORY_" in apps/backend/cfactory/config.py. PYTHONPATH is baked into
  # the image; secrets (API keys, DB URL) come from Secrets, not here.
  CFACTORY_BACKEND_PORT: {{ .Values.config.backendPort | quote }}
  CFACTORY_AIFACTORY_API_URL: {{ .Values.config.aifactoryApiUrl | quote }}
  CFACTORY_PFACTORY_API_URL: {{ .Values.config.pfactoryApiUrl | quote }}
  CFACTORY_TFACTORY_API_URL: {{ .Values.config.tfactoryApiUrl | quote }}
  CFACTORY_SUBSCRIBE_UPSTREAMS: {{ .Values.config.subscribeUpstreams | quote }}
  CFACTORY_COPILOT_MODEL: {{ .Values.config.copilotModel | quote }}
  CFACTORY_COPILOT_PROVIDER: {{ .Values.config.copilotProvider | quote }}
  CFACTORY_OLLAMA_CLOUD_BASE_URL: {{ .Values.config.ollamaCloudBaseUrl | quote }}
  CFACTORY_MULTI_TENANT: {{ .Values.config.multiTenant | quote }}
  # Board issue reconciliation (#374) — see values.yaml for the replica story.
  CFACTORY_IMPORT_POLL: {{ .Values.config.importPoll | quote }}
  CFACTORY_IMPORT_POLL_SECONDS: {{ .Values.config.importPollSeconds | quote }}
  CFACTORY_IMPORT_POLL_GAP_SECONDS: {{ .Values.config.importPollGapSeconds | quote }}
  {{- with .Values.config.publicApiUrl }}
  CFACTORY_PUBLIC_API_URL: {{ . | quote }}
  {{- end }}
