# Default values for the CFactory chart.
# This is the primary configuration surface for operators.
#
# Sections:
#   image           — container image + pull config
#   replicaCount    — pinned to 1 for v0.x (WebSocket fan-out limitation)
#   resources       — CPU/memory requests + limits
#   securityContext — non-root defaults; do not relax without review
#   service         — ClusterIP by default
#   serviceAccount  — dedicated SA, no automount of API token
#   config          — CFACTORY_* runtime configuration (upstream URLs etc.)
#   apiKeys         — scoped API keys (CFACTORY_API_KEYS) via Secret
#   database        — CFACTORY_DATABASE_URL via Secret

nameOverride: ""
fullnameOverride: ""

image:
  # Override with your private mirror.
  repository: ghcr.io/dataseeek/cfactory
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# v0.x: the cockpit WebSocket fan-out is single-replica only; >1 will need
# a shared pub/sub backend. Keep at 1 until then.
replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Non-root defaults. NEVER set runAsUser=0 or allowPrivilegeEscalation=true.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  # The backend listens on 3111 (uvicorn --port 3111).
  targetPort: 3111
  annotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The app doesn't talk to the K8s API, so don't mount the token.
  automountServiceAccountToken: false

# CFACTORY_* runtime configuration. These map 1:1 to the Settings fields in
# apps/backend/cfactory/config.py (env_prefix="CFACTORY_"). Plain (non-secret)
# values are rendered as a ConfigMap and injected via envFrom.
config:
  # Server port the container listens on. Keep in sync with service.targetPort
  # and the image's CMD (--port 3111).
  backendPort: 3111
  # Upstream service endpoints the adapters talk to. Canonical local port map:
  # AIFactory 3100/3101, TFactory 3102/3103, PFactory 3104/3105. In-cluster, point
  # these at the upstream Services (e.g. http://aifactory.ai.svc.cluster.local:3101).
  aifactoryApiUrl: "http://localhost:3101"
  pfactoryApiUrl: "http://localhost:3105"
  tfactoryApiUrl: "http://localhost:3103"
  # Connect to each upstream's WebSocket on startup. Off by default so the pod
  # doesn't reconnect-loop against upstreams that aren't up yet.
  subscribeUpstreams: false
  # Agentic copilot model id. Meaning depends on copilotProvider below: for
  # "claude" it's a Claude model (SDK reads ANTHROPIC_API_KEY); for "ollama" it's
  # a cloud model id, e.g. "gpt-oss:120b".
  copilotModel: "claude-opus-4-8"
  # Copilot LLM provider (#59): "claude" (default) or "ollama"/"openai_compatible"
  # for any OpenAI-compatible chat endpoint (Ollama Cloud). When "ollama", set
  # copilotModel to a cloud model and enable ollamaApiKey below.
  copilotProvider: "claude"
  # Base URL (with /v1 suffix) for the OpenAI-compatible copilot endpoint.
  ollamaCloudBaseUrl: "https://ollama.com/v1"
  # Multi-tenant mode (CFACTORY_MULTI_TENANT). Off by default (single-tenant,
  # "default"). When true, the tenant is resolved per request from the
  # X-Tenant-Id header. Per-tenant data isolation of queries is still deferred;
  # see guides/multi-tenant.md.
  multiTenant: false
  # Public base URL of the token-gated API surface for editor/external clients
  # (#73 follow-up), shown on the /settings/token page. Set to the cloudflared
  # host that reaches the backend directly (e.g.
  # https://cfactory-api.freundcloud.org.uk). Empty = not shown.
  publicApiUrl: ""
  # Audit actor = the human who confirmed the action (#251). Issuer of the OIDC
  # ID token oauth2-proxy already injects in front of the cockpit, e.g.
  # https://keycloak.example/realms/factory. Empty (the default, and any deploy
  # with no IdP) = a confirmed action is attributed to the API key that acted,
  # as "unattributed:key-<digest>", never to an invented name.
  oidcIssuer: ""
  # Expected `aud` on that token — the oauth2-proxy OIDC client id. Empty =
  # accept any token the issuer signed (right when the realm is the trust
  # boundary). Set it where the realm serves clients whose users must not be
  # able to name themselves in this trail.
  oidcAudience: ""
  # Audit-entry ids whose chain FORK this deployment has already explained
  # (#306, #309) — comma separated, e.g. "2178". `GET /api/audit/chain` and the
  # Audit view count a listed fork and show it, but do not let it colour the
  # verdict; anything NOT listed still does.
  #
  # A fork is two appends that raced on the tail read: both rows are genuine and
  # every HMAC in them recomputes. Relinking one is the exact edit the chain
  # exists to detect, so the row is left as written and named here instead.
  #
  # Empty (the default, and every fresh database) acknowledges nothing, which is
  # right: there, any fork at all is news. This ONLY forgives a `forked`
  # classification — a mutated, duplicate or dangling entry is reported whatever
  # is listed, so an id here can never buy silence for a later edit to that row.
  auditAcknowledgedForks: ""
  # Board issue reconciliation (#374). The backend polls each connected repository
  # every importPollSeconds and imports what changed, so the board keeps itself
  # level with the repository instead of drifting until somebody clicks. ON by
  # default in the app; set importPoll: false to stop it. importPollGapSeconds
  # paces the repositories inside one cycle (the rate-limit guard).
  #
  # Safe at replicaCount > 1: each repository's cycle is claimed by one replica via
  # a lease in card_import_state, and the unique (tenant_id, issue_ref) index means
  # the worst a lost lease can cost is a duplicated READ, never a duplicated card.
  # It does assume the replicas share a database — with the SQLite fallback (no
  # databaseUrl) each replica has its own board and its own poll.
  importPoll: true
  importPollSeconds: 300
  importPollGapSeconds: 2
  # Issue COMMENTS on cards (Factory#375). The thread comes in with the issue and
  # refreshes on the same pass; for planning the decision usually lives there. On
  # GitHub a refresh is ONE repository-wide request however big the board is, so a
  # 55-card cycle costs two API calls in total. GitLab and Azure DevOps have no
  # bulk comments endpoint, so a refresh there is one call per card — set
  # importComments: false if that is not a trade you want.
  #
  # importCommentBackfillMax bounds the cold path: a never-read card has no `since`
  # window to narrow and costs a call, so a freshly connected 200-issue repository
  # fills in over consecutive passes instead of firing 200 requests in one tick.
  importComments: true
  importCommentBackfillMax: 25
  # Extra free-form CFACTORY_* (or other) env vars, e.g.
  #   - name: ANTHROPIC_API_KEY
  #     valueFrom: { secretKeyRef: { name: cfactory-llm, key: anthropic-key } }
  extraEnv: []

# Scoped API keys (CFACTORY_API_KEYS). When empty, auth is OPEN (single-user
# local mode). In production, set existingSecret to a Secret carrying the
# "<key>:read,write;<key2>:read" string under the named key.
apiKeys:
  # When false, CFACTORY_API_KEYS is not injected (open mode).
  enabled: false
  # Name of a Secret holding the API keys string. Required when enabled=true.
  existingSecret: cfactory-api-keys
  secretKey: api-keys

# Shared bearer token for authenticated calls to the sibling factories
# (CFACTORY_UPSTREAM_TOKEN). The three factories guard their REST + WS surface
# with `Authorization: Bearer <APP_API_TOKEN>`; the cockpit must send the same
# token or every upstream fetch returns 401 (empty cockpit). When disabled, no
# token is sent — only correct for local dev where the factories run with
# APP_DISABLE_AUTH=true. In-cluster, point existingSecret at the shared
# factory-secrets Secret (key APP_API_TOKEN) used by the factories.
upstreamToken:
  enabled: false
  existingSecret: factory-secrets
  secretKey: APP_API_TOKEN

# Ollama Cloud / OpenAI-compatible copilot key (#59). When enabled, OLLAMA_API_KEY
# is injected from a Secret so the copilot can authenticate to the cloud endpoint.
# Only needed when config.copilotProvider is "ollama"/"openai_compatible". Defaults
# to the shared factory-secrets Secret (key OLLAMA_API_KEY).
ollamaApiKey:
  enabled: false
  existingSecret: factory-secrets
  secretKey: OLLAMA_API_KEY

# WorkItem correlation store. When enabled, CFACTORY_DATABASE_URL is injected
# from a Secret (key="database-url"). When disabled, the app runs without a
# correlation store (database_url=None).
database:
  enabled: false
  # Name of a Secret carrying the connection string under key "database-url".
  existingSecret: cfactory-db
  secretKey: database-url

# Cockpit UI (frontend) — served by nginx in its own pod (two-pod topology),
# proxying /api + /health + /api/ws to the backend Service.
frontend:
  enabled: true
  image:
    repository: ghcr.io/dataseeek/cfactory-frontend
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 8080  # nginx-unprivileged listens here
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  # nginx-unprivileged runs as uid 101 (not the backend's 65532).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  extraEnv: []
  # Token-gated API (#73 follow-up). When enabled, the cockpit nginx injects
  # `Authorization: Bearer <key>` on its /api + /connect proxies (via the
  # CFACTORY_API_KEY env → envsubst), so the browser cockpit keeps working once
  # the backend keystore is enforced (apiKeys.enabled). Point existingSecret at a
  # Secret carrying the BARE key (no ":scopes" suffix) — typically the same Secret
  # as apiKeys, under a different key. Enable this TOGETHER WITH apiKeys.enabled.
  apiKey:
    enabled: false
    existingSecret: cfactory-api-keys
    secretKey: api-key

# Ingress: routes / → cockpit UI and /api + /health (+ /api/ws) → backend.
# Enable and set host/className/annotations for your controller.
ingress:
  enabled: false
  className: ""
  host: cfactory.local
  # For the WebSocket feed on nginx-ingress, raise the read timeout, e.g.:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  annotations: {}
  tls: []
  #  - hosts: [cfactory.local]
  #    secretName: cfactory-tls

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

global:
  imagePullSecrets: []
