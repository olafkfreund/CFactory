; CFactory mypy config.
;
; VENDORED, PINNED COPY of the Factory fleet shared baseline:
;   Factory/standards/mypy.ini @ 93c3bb49ed5f3f3d3d46aae5f8a13ff601550702
; See Factory/standards/coding-standards.md (section 1.2) for the normative rules.
;
; Tighten-only: this service config may inherit/add stricter settings but may not
; weaken any of the strict flags below. A drift gate diffs this copy against the
; hub at the pinned SHA.
;
; Adoption is a ratchet: the blocking CI gate runs mypy on the PR's CHANGED Python
; files only (coding-standards.md section 4.6). Tracks issues #112, #116.

[mypy]
python_version = 3.11
strict = True
; strict implies the following; spelled out so the contract is visible and a
; service cannot quietly weaken one of them:
disallow_untyped_defs = True
disallow_any_generics = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_reexport = True
; Boundaries must be typed (section 1.7); surface Any leaks rather than hide them.
disallow_subclassing_any = True
extra_checks = True
