# Ruff configuration for CFactory's Python backend.
#
# The fleet-wide strict baseline lives, pinned and vendored, in `standards/` -
# see standards/README.md and standards/coding-standards.md. Until Factory#513
# this repo had no `standards/` directory: the baseline WAS this file, a
# byte-copy carrying its pin in a comment header, and the drift gate compared it
# against a SHA hardcoded in code-quality.yml. That is the one layout no other
# service uses, and it left the pin somewhere nothing outside that workflow could
# read (Factory#514 rule 5.2).
#
# Now this file is CFactory's own config and `standards/ruff.toml` is the
# vendored baseline, which is the arrangement the other three services already
# had. `extend` means every rule below is the hub's unless this file overrides
# it, so the two cannot silently disagree the way two copies can.
#
# TIGHTEN-ONLY, per the standard: this file may ADD rules or LOWER numeric caps.
# It may not remove a selected category, raise a cap, or disable a gate - that is
# what the byte-exact drift gate over standards/ exists to prevent, and a
# loosening here would defeat it just as effectively as editing the vendored copy.
#
# There are deliberately NO rule overrides. This repo's backend passes the shared
# baseline as-is, so an override section would be speculative configuration, and
# the empty case is the honest one. Add carve-outs here with a reason and a
# ratchet plan (coding-standards.md section 4.6), never in standards/.
extend = "standards/ruff.toml"

# NOT a rule override: a file this repo does not own. Factory#597 brought
# scripts/ into the lint and format gates (the ratchet was the one file the
# ratchet never looked at), and scripts/ratchet_helpers.py sits in that directory
# as a BYTE-EXACT mirror of the Factory hub canonical, kept identical by the
# verification-core drift gate.
#
# It is clean under this config today, so the widening would have gone green
# without this entry — which is the reason to add it now rather than later. The
# first hub edit that disagrees with a local rule would offer `ruff format` as
# the obvious fix, and that silently breaks byte-exactness and the next
# re-vendor (Factory#403). The hub owns this file's style; fix it there.
#
# The ratchet reads standards/ruff.toml directly, not this file, so it carries
# the same exclusion separately in VENDORED_SKIP.
extend-exclude = ["scripts/ratchet_helpers.py"]
